<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Remember When</title>
<!-- GitHub Pages serves this file for any path it can't find, e.g. /rob-jenny.
     This redirects to index.html while preserving the original path, so the app's
     own router (in index.html's <head>) can restore it and read the slug normally.
     Pattern: https://github.com/rafgraph/spa-github-pages -->
<script>
  var pathSegmentsToKeep = 0;
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body></body>
</html>
