<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Remember When</title>
<!-- GitHub Pages serves this file for any path it can't find, e.g. /rob-jenny.
     index.html (the marketing homepage) already handles the real root "/", so anything
     that lands here is a slug and belongs in app.html, not the homepage.
     This redirects to app.html?event=<slug>; app.html then looks the slug up in Supabase
     and rewrites the address bar back to the clean /<slug> once it has loaded. -->
<script>
  var slug = window.location.pathname.replace(/^\/|\/$/g, '');
  window.location.replace('/app.html?event=' + encodeURIComponent(slug));
</script>
</head>
<body></body>
</html>
